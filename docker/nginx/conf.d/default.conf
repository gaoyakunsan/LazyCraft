map $request_filename $content_disposition {
    ~*\.pdf$     "";
    default      "attachment";
}

# HTTP服务器(80端口)
server {
    listen 80;
    server_name _;
    charset utf-8;

    # Docker 内置 DNS 运行时解析：容器重建 IP 变化后无需重启 nginx
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /static/upload/ {
        alias /app/upload/;
        expires 30d;
        sendfile on;
        client_max_body_size 500M;
        add_header Access-Control-Allow-Origin * always;
        add_header Content-Disposition $content_disposition always;

        if ($request_filename ~* \.pdf$) {
            add_header Content-Type "application/pdf" always;
        }
    }
    location ~ ^/(console/api|upload|api|v1|files|inspect|openapi) {
        set $api_upstream http://api:8087;
        proxy_pass $api_upstream;
        include /etc/nginx/proxy.conf;
    }

    location ~ ^/(model_hub|ws) {
      set $api_upstream http://api:8087;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_pass $api_upstream;
      include /etc/nginx/proxy.conf;
    }

    # 上游域名用变量+运行时解析,避免启动时因DNS无法解析导致nginx退出(不可达时该路径返回502)
    set $maas_upstream https://maas.sensecore.dev;
    location /studio/gateway/v1/ {
      proxy_pass $maas_upstream$request_uri;
      proxy_ssl_verify off;
      proxy_set_header Host maas.sensecore.dev;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # MCP ECharts service
    location /mcp-echarts {
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream;
        include /etc/nginx/proxy.conf;
    }
    location / {
      set $web_upstream http://web:8088;
      proxy_pass $web_upstream;
      include /etc/nginx/proxy.conf;
    }
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# HTTPS服务器(443端口)
# 注意：如果使用HTTPS，请取消下面整个server块的注释（从server { 到对应的 }）
# 如果只使用HTTP，保持注释状态即可
server {
    listen 443 ssl;
    server_name _;
    charset utf-8;
#
    # Docker 内置 DNS 运行时解析：容器重建 IP 变化后无需重启 nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
#
    # SSL证书配置
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
#
    # SSL配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
#
    location /static/upload/ {
        alias /app/upload/;
        expires 30d;
        sendfile on;
        client_max_body_size 500M;
        add_header Access-Control-Allow-Origin * always;
        add_header Content-Disposition $content_disposition always;
#
        if ($request_filename ~* \.pdf$) {
            add_header Content-Type "application/pdf" always;
        }
    }
    
    location ~ ^/(console/api|upload|api|v1|files|inspect|openapi) {
        set $api_upstream http://api:8087;
        proxy_pass $api_upstream;
        include /etc/nginx/proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(model_hub|ws) {
      set $api_upstream http://api:8087;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_pass $api_upstream;
      include /etc/nginx/proxy.conf;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /studio/gateway/v1/ {
      set $maas_upstream https://maas.sensecore.dev;
      proxy_pass $maas_upstream$request_uri;
      proxy_ssl_verify off;
      proxy_set_header Host maas.sensecore.dev;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # MCP ECharts service
    location /mcp-echarts {
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream;
        include /etc/nginx/proxy.conf;
    }

    location / {
      set $web_upstream http://web:8088;
      proxy_pass $web_upstream;
      include /etc/nginx/proxy.conf;
      proxy_set_header X-Forwarded-Proto https;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

